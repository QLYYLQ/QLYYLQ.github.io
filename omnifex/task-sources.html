<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omnifex 题源总览</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* Layout: same drawing sheet as the Omnifex proposal and validation report. Sticky title bar with four views;
   each view is one sheet of filters plus rows. Mask green = what exists or can ship, copper = joint work and gaps,
   CAD blue and gold mark the other two task categories. */
:root{
  --paper:#F1F4F1; --sheet:#FAFBFA; --ink:#16201B; --ink-soft:#4B5852; --rule:#CDD5D0; --rule-strong:#97A49D;
  --mask:#1C5D47; --mask-wash:rgba(28,93,71,.09);
  --copper:#A9581F; --copper-wash:rgba(169,88,31,.10);
  --cad:#2C5A86; --cad-wash:rgba(44,90,134,.09);
  --gold:#7E6211; --gold-wash:rgba(126,98,17,.11);
  --on-accent:#F7F9F7;
  --font-display:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  --font-label:"IBM Plex Sans Condensed","PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1512; --sheet:#141D19; --ink:#E4EAE6; --ink-soft:#A2B0A9; --rule:#2A3631; --rule-strong:#4C5A54;
    --mask:#5BB590; --mask-wash:rgba(91,181,144,.12); --copper:#E08A4E; --copper-wash:rgba(224,138,78,.13);
    --cad:#7FAAD8; --cad-wash:rgba(127,170,216,.13); --gold:#D6B24C; --gold-wash:rgba(214,178,76,.13);
    --on-accent:#0E1512; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1512; --sheet:#141D19; --ink:#E4EAE6; --ink-soft:#A2B0A9; --rule:#2A3631; --rule-strong:#4C5A54;
  --mask:#5BB590; --mask-wash:rgba(91,181,144,.12); --copper:#E08A4E; --copper-wash:rgba(224,138,78,.13);
  --cad:#7FAAD8; --cad-wash:rgba(127,170,216,.13); --gold:#D6B24C; --gold-wash:rgba(214,178,76,.13);
  --on-accent:#0E1512; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}
a{color:var(--mask);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
code{font-family:var(--font-mono);font-size:.86em;background:var(--mask-wash);padding:.05em .35em;border-radius:2px;overflow-wrap:anywhere}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper);border-bottom:1px solid var(--rule)}
.topbar-in{display:flex;align-items:center;gap:20px;min-height:50px;flex-wrap:wrap}
.brand{font-family:var(--font-label);font-weight:600;font-size:15px;letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.brand span{color:var(--ink-soft);font-weight:500;margin-left:.45em}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs a{font-family:var(--font-label);font-size:14px;font-weight:500;color:var(--ink-soft);text-decoration:none;padding:12px 10px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--mask)}
.tabs a .n{font-family:var(--font-mono);font-size:12px;margin-left:4px;color:var(--ink-soft)}

main{padding-block:28px 64px}
.sheet{background:var(--sheet);border:1px solid var(--rule);padding:clamp(16px,3vw,32px)}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(26px,4.2vw,40px);line-height:1.2;margin:0 0 6px;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.3;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--font-label);font-weight:600;font-size:16px;margin:0}
.lede{color:var(--ink-soft);max-width:68ch;margin:0}
.label{font-family:var(--font-label);font-size:12px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase}
.view{display:grid;gap:24px}
.view[hidden]{display:none}

/* title block */
.tblock{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--rule-strong);margin-top:20px}
.tblock div{padding:10px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.tblock b{display:block;font-family:var(--font-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.tblock span{font-size:13px;color:var(--ink-soft)}

/* matrix */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--font-label);font-weight:600;font-size:13px;color:var(--ink-soft);white-space:nowrap}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cellbar{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.cellbar i{display:inline-block;height:8px;background:var(--mask);opacity:.55}
.src{display:grid;gap:0;border-top:1px solid var(--rule)}
.src > div{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:16px;padding:14px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.src b{font-family:var(--font-label);font-weight:600}
.src p{margin:0;color:var(--ink-soft);min-width:0}
.todo{margin:0;padding-left:1.2em;display:grid;gap:6px;max-width:80ch}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule-strong);position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);background:var(--sheet);z-index:5}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button,.btn{font:inherit;font-family:var(--font-label);font-size:13px;font-weight:500;padding:5px 10px;border:1px solid var(--rule-strong);background:transparent;color:var(--ink);cursor:pointer;border-radius:2px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters label{font-family:var(--font-label);font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
select,input[type="search"]{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);border-radius:2px;max-width:100%}
input[type="search"]{min-width:0;width:220px}
.count{font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);margin-left:auto}

/* rows */
.group{padding-top:22px}
.group-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding-bottom:6px;border-bottom:1px solid var(--rule-strong)}
.group-h .code{font-family:var(--font-mono);font-size:14px;font-weight:500}
.group-intro{font-size:14px;color:var(--ink-soft);margin:8px 0 0;max-width:90ch}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 150px;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.row .id{font-family:var(--font-mono);font-size:14px;font-weight:500;padding-top:1px}
.row dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.row dt{font-family:var(--font-label);font-size:13px;color:var(--ink-soft);white-space:nowrap}
.row dd{margin:0;min-width:0;overflow-wrap:anywhere}
.row .side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-family:var(--font-label);font-size:12px;font-weight:500;padding:1px 7px;border:1px solid var(--rule-strong);border-radius:2px;color:var(--ink-soft);background:transparent;white-space:nowrap}
button.chip,a.chip{cursor:pointer;color:var(--mask);border-color:var(--mask);text-decoration:none}
.cat{border:none;color:var(--on-accent)}
.cat-pcb{background:var(--mask)} .cat-cad{background:var(--cad)} .cat-joint{background:var(--copper)} .cat-gold{background:var(--gold)}
.st{border-width:1px}
.st-可出{color:var(--mask);border-color:var(--mask);background:var(--mask-wash)}
.st-待确认{color:var(--copper);border-color:var(--copper);background:var(--copper-wash)}
.st-待前置{color:var(--ink-soft);border-style:dashed}
.st-做完{color:var(--on-accent);background:var(--ink);border-color:var(--ink)}
.st-未标{color:var(--ink-soft);border-color:var(--rule)}

/* difficulty: four layers, filled like copper on a 4-layer stackup */
.meter{display:flex;align-items:center;gap:6px;font-family:var(--font-label);font-size:12px;color:var(--ink-soft)}
.meter span.stack{display:inline-grid;grid-template-columns:repeat(4,10px);gap:2px}
.meter span.stack i{height:10px;border:1px solid var(--rule-strong)}
.meter span.stack i.on{background:var(--copper);border-color:var(--copper)}

/* projects */
.boards td{font-size:13px}
.boards td.name{font-weight:500;min-width:150px}
.proj{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:16px 0;border-bottom:1px solid var(--rule)}
.proj-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.proj-h h3{font-size:17px}
.proj-h .repo{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);overflow-wrap:anywhere}
.proj dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:14px}
.proj dt{font-family:var(--font-label);font-size:13px;color:var(--ink-soft);white-space:nowrap}
.proj dd{margin:0;min-width:0;overflow-wrap:anywhere}
.repo-list,.contract-list{margin:0;padding-left:1.2em;display:grid;gap:4px}
.repo-list .chip{margin-left:5px}
.repo-list code{margin-left:5px}
.project-seeds{margin-top:8px;border-top:1px solid var(--rule);padding-top:10px}
.project-seeds>p{margin:4px 0 8px;color:var(--ink-soft);font-size:13px}
.project-seeds details{border-top:1px solid var(--rule);padding:10px 0}
.project-seeds summary{cursor:pointer;color:var(--mask);font-family:var(--font-label);font-weight:500;overflow-wrap:anywhere}
.project-seeds summary .chip{margin-left:6px}
.project-seeds details dl{margin:10px 0 0}
.project-seeds .seed-id{font-family:var(--font-mono);font-size:12px;margin-right:6px}
.subhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-top:26px;padding-bottom:6px;border-bottom:1px solid var(--rule-strong)}
.subhead p{margin:0;color:var(--ink-soft);font-size:14px}

/* events */
.ev{padding:12px 0;border-bottom:1px solid var(--rule)}
.ev-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.ev-h .id{font-family:var(--font-mono);font-size:13px;font-weight:500}
.ev-h .pn{font-family:var(--font-label);font-weight:600;font-size:14px}
.ev p.sk{margin:4px 0 0}
.ev details{margin-top:4px}
.ev summary{font-family:var(--font-label);font-size:13px;color:var(--mask);cursor:pointer}
.ev dl{margin:6px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:13.5px}
.ev dt{font-family:var(--font-label);color:var(--ink-soft);white-space:nowrap}
.ev dd{margin:0;min-width:0;overflow-wrap:anywhere}
.gold-mark{color:var(--mask);border-color:var(--mask);background:var(--mask-wash)}
.empty{padding:28px 0;color:var(--ink-soft)}

@media (max-width:720px){
  .row{grid-template-columns:minmax(0,1fr)}
  .row .side{flex-direction:row;flex-wrap:wrap}
  .src > div{grid-template-columns:minmax(0,1fr)}
  .filters{position:static}
  input[type="search"]{width:100%}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>

function meter(levels, text){
  const idx = levels.map(l => LEVELS.indexOf(l)).filter(i => i >= 0);
  const lo = idx.length ? Math.min(...idx) : -1, hi = idx.length ? Math.max(...idx) : -1;
  const cells = LEVELS.map((_, i) => `<i class="${i>=lo && i<=hi && lo>=0 ? 'on':''}"></i>`).join('');
  const label = idx.length ? (lo===hi ? LEVELS[lo] : LEVELS[lo]+'–'+LEVELS[hi]) : (text || '未定');
  return `<span class="meter" title="${esc(text||label)}"><span class="stack" aria-hidden="true">${cells}</span>${esc(label)}</span>`;
}
const stChip = s => `<span class="chip st st-${esc(s)}">${esc(s)}</span>`;

  </div>`;
  $('#tf-cat').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; TF.cat = b.dataset.v; [...$('#tf-cat').children].forEach(x => x.setAttribute('aria-pressed', x.dataset.v===TF.cat)); renderTasks(); });
  $('#tf-level').addEventListener('change', e => { TF.level = e.target.value; renderTasks(); });
  $('#tf-status').addEventListener('change', e => { TF.status = e.target.value; renderTasks(); });
  $('#tf-q').addEventListener('input', e => { TF.q = e.target.value.trim(); renderTasks(); });

function taskMatches(t){
  if (TF.cat !== '全部' && t.category !== TF.cat) return false;
  if (TF.level !== '全部' && !t.levels.includes(TF.level)) return false;
  if (TF.status !== '全部' && t.status !== TF.status) return false;
  if (TF.q){
    const q = TF.q.toLowerCase();
    const hay = (t.id+' '+t.text+' '+t.boards.join(' ')+' '+t.projects.map(p=>projById[p]?.name||'').join(' ')).toLowerCase();
    if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}
function renderTasks(){
  const list = D.tasks.filter(taskMatches);
  $('#tf-count').textContent = `${list.length} / ${D.tasks.length} 道`;
  if (!list.length){ $('#tf-list').innerHTML = `<p class="empty">没有符合条件的题。换个难度或状态，或清空搜索。</p>`; return; }
  const order = D.groups.map(g => g.code);
  const byGroup = {};
  list.forEach(t => (byGroup[t.group] = byGroup[t.group] || []).push(t));
  $('#tf-list').innerHTML = order.filter(c => byGroup[c]).map(c => {
    const g = groupByCode[c];
    const ts = byGroup[c];
    return `<div class="group">
      <div class="group-h"><span class="code">${esc(c==='G'?'G':c)}</span><h3>${esc(g.title)}</h3>${catChip(g.category)}</div>
      ${g.intro ? `<p class="group-intro">${rich(g.intro)}</p>` : ''}
      ${ts.map(taskRow).join('')}
    </div>`;
  }).join('');
}
function taskRow(t){
  const fields = t.fields.filter(([k]) => !['难度','状态','难度和说明'].includes(k));
  const links = [
    ...t.boards.map(b => `<button type="button" class="chip" data-board="${esc(b)}">D5012 · ${esc(b)}</button>`),
    ...t.projects.map(p => `<button type="button" class="chip" data-proj="${esc(p)}">${esc(projById[p]?.name||p)}</button>`)
  ].join('');
  return `<div class="row" id="task-${esc(t.id)}">
    <div class="id">${esc(t.id)}</div>
    <div><dl>${fields.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${rich(v)}</dd>`).join('')}</dl>${links?`<div class="chips">${links}</div>`:''}</div>
    <div class="side">${meter(t.levels, t.difficulty)}${stChip(t.status)}</div>
  </div>`;
}

const fmtOk = f => f === 'kicad' || f === 'jlc_std';
function hit(hay){ if(!PF.q) return true; const h = hay.toLowerCase(); return PF.q.toLowerCase().split(/\s+/).every(w => h.includes(w)); }
function projectSearchText(p){
  return [p.name,p.repo,p.primary_repo,p.pcb,p.cad,p.fw,p.license,p.note,p.fit,p.pit,p.revisions,p.complexity_summary,p.material_status,p.version_alignment,

  let html = '', shown = 0;
  if (PF.src === '全部' || PF.src === 'D5012'){

function externalLink(url, label){
  return /^https?:\/\//i.test(url||'') ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label||url)}</a>` : esc(label||url);
}
function repoUrl(repo){
  if (/^https?:\/\//i.test(repo||'')) return repo;
  if (/^(github\.com|gitlab\.com|gitee\.com)\//i.test(repo||'')) return 'https://'+repo;
  return /^[\w.-]+\/[\w.-]+$/.test(repo||'') ? 'https://github.com/'+repo : '';
}
function starChip(n){
  return `<span class="chip">${typeof n==='number'&&Number.isFinite(n)?n.toLocaleString('zh-CN')+' stars':'stars 未核'}</span>`;
}
function contractList(items){
  return `<ul class="contract-list">${items.map(v=>`<li>${rich(v)}</li>`).join('')}</ul>`;

  const links = (p.tasks||[]).map(id=>`<button type="button" class="chip" data-task="${esc(id)}">${esc(id)}</button>`).join('');
  const ev = p.events ? `<button type="button" class="chip" data-evproj="${esc(p.id)}">修订事件 ${p.events} 条，双版本候选 ${p.events_gold} 条</button>` : '';
  const repo = expanded ? (p.primary_repo||p.repo) : p.repo;
  const repos = expanded ? (p.repositories||[]).map(r=>{const ref=r.source_ref||r.head_sha;return `<li>${externalLink(r.url||repoUrl(r.repo),r.repo)} ${r.role?`<span>${esc(r.role)}</span>`:''}${starChip(r.stars)}${ref?`<span>${r.source_ref?'输入版本':'查询时 HEAD'}</span> <code title="${esc(ref)}">${esc(ref.slice(0,12))}</code>`:''}</li>`;}).join('') : '';
  const constraints = p.constraint_summaries||[];
  return `<div class="proj" id="proj-${esc(p.id)}">
    <div class="proj-h"><h3>${esc(p.name)}</h3><span class="repo">${expanded?externalLink(repoUrl(repo),repo):esc(repo)}</span>${expanded?starChip(p.stars):''}${tier}${fmtChip}</div>
    <dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${rich(v)}</dd>`).join('')}</dl>
    ${repos?`<dl><dt>仓库与角色</dt><dd><ul class="repo-list">${repos}</ul></dd></dl>`:''}
    ${constraints.length?`<dl><dt>约束链</dt><dd>${contractList(constraints)}</dd></dl>`:''}
    ${expanded?projectSeeds(p):''}
    ${(links||ev)?`<div class="chips">${links}${ev}</div>`:''}
  </div>`;
}

/* ---------------- revisions ---------------- */
const EF = {proj:'全部', kind:'全部', side:'全部', gold:false, cross:false, supplement:false, q:''};
const KIND = {issue:'issue', commit:'commit', pr:'PR', release:'release', fork:'fork'};
const SIDE = {pcb:'PCB', cad:'CAD', firmware:'固件', bom:'BOM'};
function renderRevShell(){
  const projs = [...new Set(D.events.map(e => e.project_id))].map(id => projById[id]).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
  $('#v-revisions').innerHTML = `
  <div class="sheet">
    <h2>修订事件</h2>
    <p class="lede">起始状态用冻结版本，改后版本当参考候选；未修问题单列参考解缺口。“双版本候选”只表示有人类证据、两版源文件和可用格式，不表示本地验证通过。本轮补充种子展开后可看任务输入、验收条件、保护项和欠账；“已有线索深化”表示 Claude 候选表此前已提过。</p>
    <div class="filters" role="group" aria-label="筛选修订事件">
      <label for="ef-proj">项目 <select id="ef-proj"><option>全部</option>${projs.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label>
      <label for="ef-kind">类型 <select id="ef-kind"><option>全部</option>${Object.entries(KIND).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
      <label for="ef-side">涉及 <select id="ef-side"><option>全部</option>${Object.entries(SIDE).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
      <label for="ef-gold"><input type="checkbox" id="ef-gold"> 只看双版本候选</label>
      <label for="ef-cross"><input type="checkbox" id="ef-cross"> 只看跨侧</label>
      <label for="ef-supplement"><input type="checkbox" id="ef-supplement"> 只看本轮新增种子（${M.n_seed_expansion}）</label>
      <input type="search" id="ef-q" placeholder="搜原因、题面、编号" aria-label="搜索修订事件">
      <span class="count" id="ef-count"></span>
    </div>
    <div id="ef-list"></div>
  </div>`;
  $('#ef-proj').addEventListener('change', e => { EF.proj = e.target.value; renderRev(); });
  $('#ef-kind').addEventListener('change', e => { EF.kind = e.target.value; renderRev(); });
  $('#ef-side').addEventListener('change', e => { EF.side = e.target.value; renderRev(); });
  $('#ef-gold').addEventListener('change', e => { EF.gold = e.target.checked; renderRev(); });
  $('#ef-cross').addEventListener('change', e => { EF.cross = e.target.checked; renderRev(); });
  $('#ef-supplement').addEventListener('change', e => { EF.supplement = e.target.checked; renderRev(); });
  $('#ef-q').addEventListener('input', e => { EF.q = e.target.value.trim(); renderRev(); });
}
function syncRevControls(){ $('#ef-proj').value = EF.proj; $('#ef-gold').checked = EF.gold; }
const isCross = e => new Set(e.sides.filter(s => s !== 'bom')).size > 1;
function renderRev(){
  const list = D.events.filter(e => {
    if (EF.proj !== '全部' && e.project_id !== EF.proj) return false;
    if (EF.kind !== '全部' && e.kind !== EF.kind) return false;
    if (EF.side !== '全部' && !e.sides.includes(EF.side)) return false;
    if (EF.gold && !e.gold) return false;
    if (EF.cross && !isCross(e)) return false;
    if (EF.supplement && e.seed_batch !== '20261103_task_expansion') return false;
    if (EF.q){ const h = [e.id,e.project,e.repo,e.reason,e.task_sketch,(e.task_classes||[]).join(' ')].join(' ').toLowerCase(); if(!EF.q.toLowerCase().split(/\s+/).every(w=>h.includes(w))) return false; }
    return true;
  });
  $('#ef-count').textContent = `${list.length} / ${D.events.length} 条`;
  $('#ef-list').innerHTML = list.length ? list.map(evRow).join('') : `<p class="empty">没有符合条件的事件。取消勾选或换个项目。</p>`;
}
function evRow(e){
  const p = projById[e.project_id];
  const files = Object.entries(e.files_changed||{}).filter(([,v])=>v&&v.length).map(([k,v])=>`${SIDE[k]||k}：${v.slice(0,4).join('，')}${v.length>4?` 等 ${v.length} 个`:''}`).join('；');
  const url = /^https?:\/\//.test(e.url||'') ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url)}</a>` : esc(e.url||'');
  const seedRows = [['材料状态',e.seed_material_status],['输入',e.agent_input],['验收条件',e.acceptance],['保护项',e.preservation],['欠账',e.blockers]]
    .filter(([,v])=>v&&(!Array.isArray(v)||v.length))
    .map(([k,v])=>`<dt>${esc(k)}</dt><dd>${rich(Array.isArray(v)?v.join('；'):v)}</dd>`).join('');
  const provenance = e.seed_batch ? `<span class="chip">${e.baseline_coverage==='candidate_mention'?'已有线索深化':'新增种子'}</span>` : '';
  return `<div class="ev" id="ev-${esc(e.id)}">
    <div class="ev-h"><span class="id">${esc(e.id)}</span><span class="pn">${esc(p?p.name:e.project)}</span><span class="chip">${esc(KIND[e.kind]||e.kind)}</span>${e.sides.map(s=>`<span class="chip">${esc(SIDE[s]||s)}</span>`).join('')}${e.gold?'<span class="chip gold-mark">双版本候选</span>':''}${(e.task_classes||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
    <p class="sk">${provenance}${rich(e.task_sketch)}</p>
    <details><summary>原因、证据、版本</summary><dl>
      <dt>原因</dt><dd>${rich(e.reason)}</dd>
      <dt>人类证据</dt><dd>${rich(e.human_evidence)}</dd>
      ${seedRows}
      <dt>改前</dt><dd><code>${esc(e.before_ref||'—')}</code></dd>
      <dt>改后</dt><dd><code>${esc(e.after_ref||'—')}</code></dd>
      ${e.source_snapshot?`<dt>起始快照</dt><dd><code>${esc(e.source_snapshot.ref||'—')}</code> ${rich(e.source_snapshot.role||'')}</dd>`:''}
      <dt>源文件</dt><dd>${esc(e.sources_available)}；仓库 PCB 格式 ${esc(e.repo_pcb_format||'无')}</dd>
      ${files?`<dt>${e.before_ref&&e.after_ref?'改动文件':'题源文件'}</dt><dd>${esc(files)}</dd>`:''}
      ${e.notes?`<dt>备注</dt><dd>${rich(e.notes)}</dd>`:''}
      <dt>链接</dt><dd>${url}</dd>
      <dt>核实</dt><dd>${esc(e.verified)}</dd>
    </dl></details>
  </div>`;
}

/* ---------------- routing and cross links ---------------- */
const VIEWS = ['overview','tasks','projects','revisions'];
function show(view){
  if (!VIEWS.includes(view)) view = 'overview';
  VIEWS.forEach(v => { $('#v-'+v).hidden = v !== view; });
  document.querySelectorAll('.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.view===view ? 'page' : 'false'));
  store.set('omnifex-view', view);
}
function route(){ show((location.hash||'').slice(1) || 'overview'); }
function go(view, after){
  if (location.hash.slice(1) !== view) location.hash = view; else show(view);
  show(view);
  requestAnimationFrame(() => { after && after(); });
}
function scrollToEl(id){ const el = document.getElementById(id); if (el){ el.scrollIntoView({block:'start'}); el.style.background = 'var(--mask-wash)'; setTimeout(()=>{el.style.background='';}, 1600); } }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-task],[data-proj],[data-board],[data-evproj],[data-go]');
  if (!t) return;
  if (t.dataset.task){ e.preventDefault(); TF.cat='全部'; TF.level='全部'; TF.status='全部'; TF.q=''; renderTasksShell(); renderTasks(); go('tasks', ()=>scrollToEl('task-'+t.dataset.task)); }
  else if (t.dataset.proj){ const p = projById[t.dataset.proj]; setProjSrc(PROJECT_GROUPS[p.group]||'全部'); PF.direct=false; PF.q=''; $('#pf-direct').checked=false; $('#pf-q').value=''; renderProjects(); go('projects', ()=>scrollToEl('proj-'+p.id)); }
  else if (t.dataset.board){ setProjSrc('D5012'); PF.q=t.dataset.board; $('#pf-q').value=PF.q; renderProjects(); go('projects'); }
  else if (t.dataset.evproj){ EF.proj=t.dataset.evproj; EF.gold=false; syncRevControls(); renderRev(); go('revisions'); }
  else if (t.dataset.go){ e.preventDefault(); const [v, arg] = t.dataset.go.split(':');
    if (v==='projects'){ setProjSrc(arg==='d5012'?'D5012':(PROJECT_GROUPS[arg]||'全部')); PF.direct=false; PF.q=''; $('#pf-direct').checked=false; $('#pf-q').value=''; renderProjects(); go('projects'); }
    if (v==='revisions'){ EF.proj='全部'; EF.gold = arg==='gold'; syncRevControls(); renderRev(); go('revisions'); } }
});
window.addEventListener('hashchange', route);

renderOverview();
renderTasksShell(); renderTasks();
renderProjectsShell(); renderProjects();
renderRevShell(); renderRev();
if (!location.hash){ const v = store.get('omnifex-view'); if (v && VIEWS.includes(v) && v !== 'overview') { show(v); } else route(); } else route();
})();
</script>
