<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 458" width="820" height="458" font-family="Helvetica, Arial, sans-serif" font-size="15"><rect width="820" height="458" fill="#0c1411"/>
<text x="30" y="36" fill="#fff" font-weight="bold" font-size="17">主板上板对板连接器的脚位（信号对应的脚号）</text>
<rect x="20" y="56" width="780" height="38" fill="#173a2d"/>
<text x="30" y="81" fill="#e8cf6a" font-weight="bold">信号</text>
<text x="260" y="81" fill="#e8cf6a" font-weight="bold">改前 CON1（FFC 8 脚）</text>
<text x="560" y="81" fill="#e8cf6a" font-weight="bold">改后 J1（弹簧触点 8 脚）</text>
<text x="30" y="119" fill="#ffffff" font-weight="normal">GPIO5</text>
<text x="260" y="119" fill="#ffffff" font-weight="normal">1</text>
<text x="560" y="119" fill="#5ff2ff" font-weight="normal">1</text>
<rect x="20" y="132" width="780" height="38" fill="#10261e"/>
<text x="30" y="157" fill="#ffffff" font-weight="normal">DC</text>
<text x="260" y="157" fill="#ffffff" font-weight="normal">5</text>
<text x="560" y="157" fill="#5ff2ff" font-weight="normal">2</text>
<text x="30" y="195" fill="#ffffff" font-weight="normal">GPIO4</text>
<text x="260" y="195" fill="#ffffff" font-weight="normal">2</text>
<text x="560" y="195" fill="#5ff2ff" font-weight="normal">3</text>
<rect x="20" y="208" width="780" height="38" fill="#10261e"/>
<text x="30" y="233" fill="#ffffff" font-weight="normal">GND</text>
<text x="260" y="233" fill="#ffffff" font-weight="normal">6</text>
<text x="560" y="233" fill="#5ff2ff" font-weight="normal">4</text>
<text x="30" y="271" fill="#ffffff" font-weight="normal">GPIO23</text>
<text x="260" y="271" fill="#ffffff" font-weight="normal">3</text>
<text x="560" y="271" fill="#5ff2ff" font-weight="normal">5</text>
<rect x="20" y="284" width="780" height="38" fill="#10261e"/>
<text x="30" y="309" fill="#ffffff" font-weight="normal">3V3</text>
<text x="260" y="309" fill="#ffffff" font-weight="normal">7</text>
<text x="560" y="309" fill="#5ff2ff" font-weight="normal">6</text>
<text x="30" y="347" fill="#ffffff" font-weight="normal">GPIO18</text>
<text x="260" y="347" fill="#ffffff" font-weight="normal">4</text>
<text x="560" y="347" fill="#5ff2ff" font-weight="normal">7</text>
<rect x="20" y="360" width="780" height="38" fill="#10261e"/>
<text x="30" y="385" fill="#ffffff" font-weight="normal">VDD_5V</text>
<text x="260" y="385" fill="#ffffff" font-weight="normal">8</text>
<text x="560" y="385" fill="#5ff2ff" font-weight="normal">8</text>
<text x="30" y="428" fill="#c9d3cf" font-size="13.5">按 KiCad 导入后的焊盘网络整理（本页重算）。8 个信号都在，只是脚序重排。</text>
</svg>