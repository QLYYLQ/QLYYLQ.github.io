<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 382" width="960" height="382" font-family="Helvetica, Arial, sans-serif" font-size="15"><rect width="960" height="382" fill="#0c1411"/>
<text x="30" y="36" fill="#fff" font-weight="bold" font-size="17">左缘连接器的焊盘网络</text>
<rect x="20" y="56" width="920" height="38" fill="#173a2d"/>
<text x="30" y="81" fill="#e8cf6a" font-weight="bold">焊盘</text>
<text x="130" y="81" fill="#e8cf6a" font-weight="bold">改前 P4（5 脚）</text>
<text x="370" y="81" fill="#e8cf6a" font-weight="bold">改后 P1（5 脚，同一位置）</text>
<text x="690" y="81" fill="#e8cf6a" font-weight="bold">改后 P4（6 脚，新增）</text>
<text x="30" y="119" fill="#ffffff" font-weight="normal">1</text>
<text x="130" y="119" fill="#ffffff" font-weight="normal">GND</text>
<text x="370" y="119" fill="#ff3d6e" font-weight="normal">UART1_RX</text>
<text x="690" y="119" fill="#5ff2ff" font-weight="normal">MT6816_AUX_CS</text>
<rect x="20" y="132" width="920" height="38" fill="#10261e"/>
<text x="30" y="157" fill="#ffffff" font-weight="normal">2</text>
<text x="130" y="157" fill="#ffffff" font-weight="normal">UART1_RX</text>
<text x="370" y="157" fill="#ff3d6e" font-weight="normal">UART1_TX</text>
<text x="690" y="157" fill="#5ff2ff" font-weight="normal">SPI1_MISO</text>
<text x="30" y="195" fill="#ffffff" font-weight="normal">3</text>
<text x="130" y="195" fill="#ffffff" font-weight="normal">UART1_TX</text>
<text x="370" y="195" fill="#ff3d6e" font-weight="normal">GND</text>
<text x="690" y="195" fill="#5ff2ff" font-weight="normal">SPI1_MOSI</text>
<rect x="20" y="208" width="920" height="38" fill="#10261e"/>
<text x="30" y="233" fill="#ffffff" font-weight="normal">4</text>
<text x="130" y="233" fill="#ffffff" font-weight="normal">DM（USB D-）</text>
<text x="370" y="233" fill="#ff3d6e" font-weight="normal">NetP1_4（连 TL431 U4）</text>
<text x="690" y="233" fill="#5ff2ff" font-weight="normal">SPI1_SCK</text>
<text x="30" y="271" fill="#ffffff" font-weight="normal">5</text>
<text x="130" y="271" fill="#ffffff" font-weight="normal">DP（USB D+）</text>
<text x="370" y="271" fill="#ff3d6e" font-weight="normal">ADC_ENC</text>
<text x="690" y="271" fill="#5ff2ff" font-weight="normal">GND</text>
<rect x="20" y="284" width="920" height="38" fill="#10261e"/>
<text x="30" y="309" fill="#ffffff" font-weight="normal">6</text>
<text x="130" y="309" fill="#ffffff" font-weight="normal"></text>
<text x="370" y="309" fill="#ffffff" font-weight="normal"></text>
<text x="690" y="309" fill="#5ff2ff" font-weight="normal">VCC_3V3</text>
<text x="30" y="352" fill="#c9d3cf" font-size="13.5">按 KiCad 导入后的焊盘网络整理（本页重算）。两版的 5 脚座都在板左缘 (132.63, 106.02) mm，只是改后叫 P1。</text>
</svg>