<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" width="1100" height="550" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Peak原始供电网络：电池接VBAT_IN，U6为蜂鸣器</title>
<desc id="desc">冻结输入的网络摘录。USB接充电芯片，充电输出VBAT_IN同时接实际电池和Q1源极；Q1漏极的VBAT接稳压器、蜂鸣器和测量分压。本图不是新参考电源方案。</desc>
<rect width="1100" height="550" fill="#0c1411"/>
<text x="25" y="32" fill="#fff" font-size="20" font-weight="bold">Peak 原始供电网络</text>
<text x="1075" y="32" text-anchor="end" fill="#c9d3cf" font-size="13">冻结输入 · 非完整原理图 · 非新参考解</text>
<path d="M130 150 H180" fill="none" stroke="#c2c7c9" stroke-width="2.5"/>
<path d="M360 150 H520" fill="none" stroke="#ffd23f" stroke-width="2.5"/>
<path d="M440 150 V300" fill="none" stroke="#ffd23f" stroke-width="2.5"/>
<path d="M730 150 H790 V405" fill="none" stroke="#ffd23f" stroke-width="2.5"/>
<path d="M790 150 V85 H850" fill="none" stroke="#ffd23f" stroke-width="2.5"/>
