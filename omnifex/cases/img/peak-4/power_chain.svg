<text x="427.5" y="368" text-anchor="middle" fill="#c9d3cf" font-size="12.5">负极接GND</text>
<rect x="540" y="240" width="230" height="145" rx="6" fill="#173a2d" stroke="#7fb0dd" stroke-width="2"/>
<text x="655.0" y="267" text-anchor="middle" fill="#fff" font-size="15">Q1 软开关控制</text>
<text x="655.0" y="289" text-anchor="middle" fill="#c9d3cf" font-size="12.5">R3 20K上拉至VBAT_IN</text>
<text x="655.0" y="308" text-anchor="middle" fill="#c9d3cf" font-size="12.5">Q2拉低Q1栅极</text>
<text x="655.0" y="327" text-anchor="middle" fill="#c9d3cf" font-size="12.5">GPIO21经D3控制Q2</text>
<text x="655.0" y="346" text-anchor="middle" fill="#c9d3cf" font-size="12.5">R7 20K下拉Q2栅极</text>
<rect x="20" y="300" width="280" height="100" rx="6" fill="#173a2d" stroke="#5ff2ff" stroke-width="2"/>
<text x="160.0" y="327" text-anchor="middle" fill="#fff" font-size="15">CHG_DET：U3 STAT</text>
<text x="160.0" y="349" text-anchor="middle" fill="#c9d3cf" font-size="12.5">R11 10K上拉至VCC_3V3</text>
<text x="160.0" y="368" text-anchor="middle" fill="#c9d3cf" font-size="12.5">R10 1K串D4接VUSB</text>
<text x="440" y="130" text-anchor="middle" fill="#ffd23f" font-size="15">VBAT_IN</text>
<text x="790" y="429" text-anchor="middle" fill="#ffd23f" font-size="15">VBAT</text>
<circle cx="440" cy="150" r="4" fill="#ffd23f"/>
<text x="25" y="491" fill="#c9d3cf" font-size="13">来源：冻结输入7605edc7的Altium网表与原生PCB焊盘。连线为相关网络摘录。</text>
<text x="25" y="516" fill="#c9d3cf" font-size="13">电池不在Q1后的VBAT节点；此图不宣称原设计或正在校准的新方案已经通过工程验收。</text>
</svg>
