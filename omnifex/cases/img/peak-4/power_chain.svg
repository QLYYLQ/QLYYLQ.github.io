<path d="M625 195 V240" fill="none" stroke="#7fb0dd" stroke-width="2.5" stroke-dasharray="6 4"/>
<rect x="20" y="115" width="110" height="70" rx="6" fill="#173a2d" stroke="#e8cf6a" stroke-width="2"/>
<text x="75.0" y="142" text-anchor="middle" fill="#fff" font-size="15">VUSB</text>
<text x="75.0" y="164" text-anchor="middle" fill="#c9d3cf" font-size="12.5">USB 5 V</text>
<rect x="180" y="105" width="180" height="90" rx="6" fill="#173a2d" stroke="#ff3d6e" stroke-width="2"/>
<text x="270.0" y="132" text-anchor="middle" fill="#fff" font-size="15">U3 MCP73831T</text>
<text x="270.0" y="154" text-anchor="middle" fill="#c9d3cf" font-size="12.5">锂电池充电芯片</text>
<rect x="520" y="105" width="210" height="90" rx="6" fill="#173a2d" stroke="#ff3d6e" stroke-width="2"/>
<text x="625.0" y="132" text-anchor="middle" fill="#fff" font-size="15">Q1 AO3401A</text>
<text x="625.0" y="154" text-anchor="middle" fill="#c9d3cf" font-size="12.5">P-MOS</text>
<text x="625.0" y="173" text-anchor="middle" fill="#c9d3cf" font-size="12.5">S接VBAT_IN；D接VBAT</text>
<rect x="850" y="40" width="230" height="100" rx="6" fill="#173a2d" stroke="#e8cf6a" stroke-width="2"/>
<text x="965.0" y="67" text-anchor="middle" fill="#fff" font-size="15">U6 DET402 蜂鸣器</text>
<text x="965.0" y="89" text-anchor="middle" fill="#c9d3cf" font-size="12.5">正极接VBAT</text>
<text x="965.0" y="108" text-anchor="middle" fill="#c9d3cf" font-size="12.5">负极经Q5，由BUZZ控制</text>
<rect x="850" y="200" width="230" height="100" rx="6" fill="#173a2d" stroke="#ff3d6e" stroke-width="2"/>
<text x="965.0" y="227" text-anchor="middle" fill="#fff" font-size="15">U1 LP2992 3V3</text>
<text x="965.0" y="249" text-anchor="middle" fill="#c9d3cf" font-size="12.5">VIN / ON/OFF 接VBAT</text>
<text x="965.0" y="268" text-anchor="middle" fill="#c9d3cf" font-size="12.5">输出VCC_3V3供系统使用</text>
<rect x="850" y="360" width="230" height="90" rx="6" fill="#173a2d" stroke="#e8cf6a" stroke-width="2"/>
<text x="965.0" y="387" text-anchor="middle" fill="#fff" font-size="15">R2 / R4，各100K</text>
<text x="965.0" y="409" text-anchor="middle" fill="#c9d3cf" font-size="12.5">VBAT分压至BAT_DET</text>
<text x="965.0" y="428" text-anchor="middle" fill="#c9d3cf" font-size="12.5">此处为原始测量连接</text>
<rect x="335" y="300" width="185" height="90" rx="6" fill="#173a2d" stroke="#e8cf6a" stroke-width="2"/>
<text x="427.5" y="327" text-anchor="middle" fill="#fff" font-size="15">实际电池：无位号焊盘</text>
