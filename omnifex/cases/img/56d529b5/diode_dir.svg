<g fill="#e8ebe4">
<text x="40" y="125">串口线 TXD/RXD</text><text x="335" y="125">N（保持节点）→ Q 基极</text>
<text x="40" y="320" fill="#ff3d6e">题面和 Sonnet：阳极(A)接串口线</text>
<text x="40" y="345">线路拉低时二极管反偏，N 点由 10k 上拉保持为高，</text><text x="40" y="365">PNP 不导通，指示灯永远不亮。</text>
<text x="540" y="125">串口线 TXD/RXD</text><text x="835" y="125">N</text>
<text x="540" y="320" fill="#7dffa0">上游：阴极(K)接串口线</text>
<text x="540" y="345">线路拉低时二极管导通，把 N 点拉低，PNP 导通点灯；</text><text x="540" y="365">线路回到高电平后，电容让 N 点慢慢恢复，灯多亮一会儿。</text>
<text x="262" y="75">10k</text><text x="262" y="210">10 nF</text><text x="262" y="35">+3V3</text><text x="262" y="270">（电容接 +3V3）</text>
<text x="762" y="75">10k</text><text x="762" y="210">10 nF</text><text x="762" y="35">+3V3</text><text x="762" y="270">（电容接 +3V3）</text>
<text x="40" y="410" font-size="14" fill="#9fb">本页示意图，按网表和复核说明画</text>
